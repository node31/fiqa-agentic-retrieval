<!doctype html>
<!--
  A browser client for the FiQA A2A agent (served at /ui by src/a2a/server.py).

  Everything here is an ordinary A2A client, written in plain JavaScript so you can read it:
    GET  /.well-known/agent-card.json      discovery: who the agent is, its skills, how to authenticate
    POST /a2a  SendMessage                 start a task (returnImmediately: true, so we can watch it run)
    POST /a2a  GetTask                     poll until the task reaches a terminal state
    POST /a2a  ListTasks                   the caller's own tasks (another user's never show up)
    GET / POST / DELETE  /memory           what the agent remembers about the logged-in user (plain REST)
  Every JSON-RPC request and response is shown in the "Wire" panel. The bearer token decides who you are:
  pick alice or bob (when the server runs with --demo-logins) or paste a token from
  python -m scripts.mint_token <user>. Anonymous works too, but gets no memory.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>FiQA A2A agent</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg:#f6f7f9; --card:#fff; --line:#d9dde3; --ink:#1d2430; --muted:#667085; --acc:#1f6feb;
          --ok:#1a7f37; --bad:#c62828; --warn:#9a6700; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 system-ui, Segoe UI, sans-serif; color:var(--ink); background:var(--bg); }
  header { display:flex; gap:14px; align-items:center; padding:10px 16px; background:#1d2430; color:#fff; }
  header h1 { font-size:17px; margin:0 12px 0 0; }
  header select, header input, header button { font:inherit; }
  header input { width:280px; }
  #who { font-size:13px; color:#cfd6e0; }
  main { display:grid; grid-template-columns: 300px 1fr 360px; gap:12px; padding:12px; height:calc(100vh - 52px); }
  section { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px 12px;
            overflow:auto; min-height:0; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:4px 0 8px; }
  .col { display:flex; flex-direction:column; gap:12px; min-height:0; }
  .skill { border-top:1px solid var(--line); padding:6px 0; }
  .answer { background:#f0fdf4; border:1px solid #bbf7d0; border-radius:6px; padding:6px 9px; margin:6px 0; line-height:1.45; }
  .answer b { display:block; font-size:11px; text-transform:uppercase; color:#166534; letter-spacing:.04em; }
  .skill b { font-family:Consolas, monospace; }
  .ex { color:var(--acc); cursor:pointer; display:block; font-size:12.5px; }
  .ex:hover { text-decoration:underline; }
  #chat { flex:1; }
  #log { display:flex; flex-direction:column; gap:10px; }
  .me { align-self:flex-end; background:#dbeafe; padding:7px 11px; border-radius:12px; max-width:80%; }
  .task { border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
  .states { font-size:12px; color:var(--muted); margin-bottom:4px; }
  .badge { display:inline-block; padding:0 7px; border-radius:9px; font-size:12px; color:#fff; background:var(--muted); }
  .COMPLETED { background:var(--ok); } .FAILED, .REJECTED, .CANCELED { background:var(--bad); }
  .WORKING, .SUBMITTED { background:var(--warn); } .AUTH_REQUIRED { background:#8250df; }
  .hit { border-top:1px dashed var(--line); padding:4px 0; font-size:13px; }
  .hit code { color:var(--acc); }
  .note { font-size:12.5px; color:var(--muted); }
  .mem { background:#fff8c5; padding:3px 7px; border-radius:5px; font-size:12.5px; margin:3px 0; }
  .err { color:var(--bad); }
  form#ask { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  form#ask input[name=q] { flex:1; min-width:260px; padding:7px; font:inherit; }
  button { cursor:pointer; }
  .row { display:flex; justify-content:space-between; gap:6px; border-top:1px solid var(--line); padding:4px 0;
         font-size:13px; }
  .row:hover { background:#f2f5f9; }
  .x { color:var(--bad); border:none; background:none; font-size:15px; }
  pre { background:#0f172a; color:#e2e8f0; padding:8px; border-radius:6px; font-size:11.5px; white-space:pre-wrap;
        word-break:break-word; margin:4px 0 10px; }
  .dir { font-size:12px; font-weight:600; }
</style>
</head>
<body>
<header>
  <h1 id="title">A2A agent</h1>
  <label>Signed in as
    <select id="user"><option value="">anonymous</option><option value="paste">paste a token...</option></select>
  </label>
  <input id="token" placeholder="eyJ... (python -m scripts.mint_token alice)" hidden>
  <span id="who"></span>
</header>
<main>
  <div class="col">
    <section id="cardbox"><h2>Agent card</h2><div id="card">loading...</div></section>
  </div>
  <div class="col">
    <section id="chat">
      <h2>Conversation <button id="newctx" title="start a new contextId">new conversation</button></h2>
      <div id="log"></div>
      <form id="ask">
        <input name="q" placeholder="Ask a personal-finance question" autocomplete="off">
        <select name="skill" id="skill"></select>
        <label class="note">k <input name="k" type="number" value="5" min="1" max="50" style="width:48px"></label>
        <label class="note"><input name="memory" type="checkbox" checked> use memory</label>
        <button>Send</button>
      </form>
    </section>
  </div>
  <div class="col">
    <section><h2>My tasks <button id="refresh">refresh</button></h2><div id="tasks" class="note">none yet</div></section>
    <section>
      <h2>What the agent remembers about me</h2>
      <div id="memory" class="note"></div>
      <form id="remember" style="display:flex;gap:6px;margin-top:6px">
        <input name="text" placeholder="I live in Canada" style="flex:1"><button>Remember</button>
      </form>
      <button id="forget" style="margin-top:6px">Forget everything</button>
    </section>
    <section style="flex:1"><h2>Wire (last call)</h2><div id="wire" class="note">every request and response shows here</div></section>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const short = (state) => (state || "").replace("TASK_STATE_", "");
let card = null, token = "", contextId = null, cfg = {demo_logins: [], memory: false};
const tokens = {};          // user -> token, so switching back and forth keeps each user's login
const contexts = {};        // user -> contextId, so each user keeps their own conversation

function claims(tok) {      // decode the JWT payload for display only; the SERVER verifies the signature
  try { return JSON.parse(atob(tok.split(".")[1].replace(/-/g, "+").replace(/_/g, "/"))); } catch { return null; }
}
function headers() {
  return {"Content-Type": "application/json", "A2A-Version": "1.0", ...(token ? {Authorization: "Bearer " + token} : {})};
}
function showWire(label, req, res, status) {
  $("wire").innerHTML = `<div class="dir">${esc(label)}</div><div class="dir">request</div><pre>${esc(JSON.stringify(req, null, 1))}</pre>` +
    `<div class="dir">response${status ? " (HTTP " + status + ")" : ""}</div><pre>${esc(JSON.stringify(res, null, 1))}</pre>`;
}

// One JSON-RPC 2.0 call to /a2a. Errors come back as {"error": {code, message, data}}, still HTTP 200.
let rpcId = 0;
async function rpc(method, params) {
  const req = {jsonrpc: "2.0", id: ++rpcId, method, params};
  const r = await fetch("/a2a", {method: "POST", headers: headers(), body: JSON.stringify(req)});
  const body = await r.json();
  showWire("POST /a2a " + method, req, body, r.status);
  if (r.status === 401) throw new Error(body.detail || "invalid token");
  if (body.error) throw new Error(`${body.error.code}: ${body.error.message}`);
  return body.result;
}
async function rest(method, path, json) {
  const r = await fetch(path, {method, headers: headers(), ...(json ? {body: JSON.stringify(json)} : {})});
  const body = await r.json().catch(() => ({}));
  showWire(`${method} ${path}`, json ?? null, body, r.status);
  return {status: r.status, body};
}

// ---------------------------------------------------------------- discovery
async function loadCard() {
  card = await (await fetch("/.well-known/agent-card.json")).json();
  $("title").textContent = card.name;
  document.title = card.name;
  const sec = Object.entries(card.securitySchemes || {}).map(([k, v]) =>
    `${esc(k)}: ${esc(v.httpAuthSchemeScheme?.scheme || v.httpAuthSecurityScheme?.scheme || "")} ${esc(v.httpAuthSecurityScheme?.bearerFormat || "")}`).join("<br>");
  $("card").innerHTML = `<div>${esc(card.description)}</div>
    <p class="note">version ${esc(card.version)} &middot; A2A ${esc(card.supportedInterfaces?.[0]?.protocolVersion)}
    &middot; ${esc(card.supportedInterfaces?.[0]?.protocolBinding)}<br>
    streaming: ${card.capabilities?.streaming} &middot; push: ${card.capabilities?.pushNotifications}<br>auth: ${sec || "none"}</p>` +
    card.skills.map((s) => `<div class="skill"><b>${esc(s.id)}</b> ${esc(s.name)}<div class="note">${esc(s.description)}</div>` +
      (s.examples || []).map((e) => `<span class="ex" data-q="${esc(e)}" data-skill="${esc(s.id)}">&rsaquo; ${esc(e)}</span>`).join("") +
      `</div>`).join("") + `<p class="note"><a href="/.well-known/agent-card.json" target="_blank">raw card</a></p>`;
  $("skill").innerHTML = card.skills.map((s) => `<option>${esc(s.id)}</option>`).join("");
  document.querySelectorAll(".ex").forEach((el) => el.onclick = () => {
    document.forms.ask.q.value = el.dataset.q; $("skill").value = el.dataset.skill; });
}

// ---------------------------------------------------------------- who am I
async function signIn(user) {
  $("token").hidden = user !== "paste";
  if (user === "paste") { token = $("token").value.trim(); }
  else if (!user) { token = ""; }
  else if (!tokens[user]) {
    const r = await fetch("/ui/login", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({user})});
    const body = await r.json();
    if (!r.ok) { alert(body.detail); $("user").value = ""; token = ""; }
    else { tokens[user] = body.token; token = body.token; }
  } else { token = tokens[user]; }
  const c = token ? claims(token) : null;
  $("who").textContent = c ? `sub=${c.sub}  tenant=${c.tenant}  role=${c.role}` : "no token: anonymous (no memory)";
  contextId = contexts[user || "anon"] || null;
  $("log").innerHTML = "";
  await Promise.all([refreshTasks(), refreshMemory()]);
}

// ---------------------------------------------------------------- one question = one task
async function ask(ev) {
  ev.preventDefault();
  const f = document.forms.ask, q = f.q.value.trim();
  if (!q) return;
  f.q.value = "";
  $("log").insertAdjacentHTML("beforeend", `<div class="me">${esc(q)}</div>`);
  const box = document.createElement("div"); box.className = "task"; $("log").appendChild(box);
  const seen = [];
  const message = {messageId: crypto.randomUUID(), role: "ROLE_USER", parts: [{text: q}],
                   ...(contextId ? {contextId} : {}),
                   metadata: {skill: f.skill.value, k: Number(f.k.value), ...(f.memory.checked ? {} : {memory: false})}};
  try {
    // returnImmediately: the server answers with the task at SUBMITTED; we then poll GetTask (no streaming here).
    let task = (await rpc("SendMessage", {message, configuration: {returnImmediately: true}})).task;
    contextId = task.contextId; contexts[$("user").value || "anon"] = contextId;
    const t0 = performance.now();
    while (true) {
      const s = short(task.status.state);
      if (seen.at(-1) !== s) seen.push(s);
      renderTask(box, task, seen);
      if (["COMPLETED", "FAILED", "CANCELED", "REJECTED", "AUTH_REQUIRED", "INPUT_REQUIRED"].includes(s)) break;
      if (performance.now() - t0 > 120000) break;
      await new Promise((r) => setTimeout(r, 150));
      task = await rpc("GetTask", {id: task.id});
    }
  } catch (e) {
    box.innerHTML = `<span class="err">${esc(e.message)}</span>`;
  }
  $("log").parentElement.scrollTop = 1e9;
  await Promise.all([refreshTasks(), refreshMemory()]);
}

function renderTask(box, task, seen) {
  const s = short(task.status.state), m = task.metadata || {}, mem = m.memory || {};
  const data = task.artifacts?.[0]?.parts?.find((p) => p.data)?.data;
  const q = task.history?.[0]?.parts?.[0]?.text;
  let html = `<div class="states">task ${esc(task.id.slice(0, 8))} &middot; context ${esc(task.contextId.slice(0, 8))} &middot; ` +
    seen.map((x) => `<span class="badge ${x}">${x}</span>`).join(" &rarr; ") + `</div>`;
  if (mem.enabled && mem.query_searched && mem.query_searched !== q)
    html += `<div class="mem">memory changed the search: <b>${esc(mem.query_searched)}</b>` +
      (mem.turn_used ? ` (follow-up of "${esc(mem.turn_used)}")` : "") +
      (mem.facts_used?.length ? ` (facts: ${mem.facts_used.map(esc).join(", ")})` : "") + `</div>`;
  if (task.status.message) html += `<div class="err">${esc(task.status.message.parts?.[0]?.text)}</div>`;
  const answer = task.artifacts?.find((a) => a.name === "answer")?.parts?.[0]?.text;
  if (answer) html += `<div class="answer"><b>LLM answer</b> ${esc(answer)}</div>`;
  if (data) html += data.hits.map((h) => `<div class="hit"><code>${esc(h.doc_id)}</code>` +
    (h.score !== undefined ? ` <span class="note">${h.score}</span>` : "") + ` ${esc(h.snippet)}</div>`).join("");
  if (s === "COMPLETED")
    html += `<div class="note">skill ${esc(m.skill)} &middot; ${m.llm_calls ?? 0} LLM calls &middot; $${m.usd ?? 0} &middot; ${m.latency_s}s</div>`;
  box.innerHTML = html;
}

// ---------------------------------------------------------------- my tasks (ListTasks only ever returns mine)
async function refreshTasks() {
  try {
    const r = await rpc("ListTasks", {historyLength: 1});
    $("tasks").innerHTML = r.tasks.length ? r.tasks.slice().reverse().map((t) =>
      `<div class="row" data-id="${esc(t.id)}"><span><span class="badge ${short(t.status.state)}">${short(t.status.state)}</span>
       ${esc(t.history?.[0]?.parts?.[0]?.text || "")}</span><code>${esc(t.id.slice(0, 8))}</code></div>`).join("")
      : "none yet";
    $("tasks").querySelectorAll(".row").forEach((el) => el.onclick = () => rpc("GetTask", {id: el.dataset.id}));
  } catch (e) { $("tasks").innerHTML = `<span class="err">${esc(e.message)}</span>`; }
}

// ---------------------------------------------------------------- memory: see it, add to it, delete it
async function refreshMemory() {
  if (!cfg.memory) { $("memory").textContent = "this server runs without memory"; return; }
  if (!token) { $("memory").textContent = "sign in to see your memory (anonymous callers get none)"; return; }
  const {status, body} = await rest("GET", "/memory");
  if (status !== 200) { $("memory").innerHTML = `<span class="err">${esc(body.detail)}</span>`; return; }
  const now = Date.now() / 1000;
  $("memory").innerHTML = body.entries.length ? body.entries.map((e) =>
    `<div class="row"><span><b>${esc(e.kind)}</b> ${esc(e.text)}
     <span class="note">(expires in ${Math.round((e.expires - now) / 86400)} d)</span></span>
     <button class="x" title="delete this entry" data-id="${esc(e.id)}">&times;</button></div>`).join("")
    : `nothing stored for ${esc(body.user)} (${esc(body.tenant)})`;
  $("memory").querySelectorAll(".x").forEach((b) => b.onclick = async () => {
    await rest("DELETE", "/memory/" + encodeURIComponent(b.dataset.id)); refreshMemory(); });
}

$("remember").onsubmit = async (ev) => {
  ev.preventDefault(); const t = ev.target.text.value.trim(); if (!t || !token) return;
  await rest("POST", "/memory", {text: t}); ev.target.text.value = ""; refreshMemory();
};
$("forget").onclick = async () => { if (token) { await rest("DELETE", "/memory"); refreshMemory(); } };
$("refresh").onclick = refreshTasks;
$("newctx").onclick = () => { contextId = null; contexts[$("user").value || "anon"] = null; $("log").innerHTML = ""; };
$("ask").onsubmit = ask;
$("user").onchange = (ev) => signIn(ev.target.value);
$("token").onchange = () => signIn("paste");

(async () => {
  cfg = await (await fetch("/ui/config")).json();
  for (const u of cfg.demo_logins)
    $("user").insertAdjacentHTML("beforeend", `<option value="${esc(u)}">${esc(u)} (demo login)</option>`);
  await loadCard();
  await signIn("");
})();
</script>
</body>
</html>
